# Poker Coach - static vanilla site. No build step: public/ ships as-is.
#
# `command` runs LOCALLY before `netlify deploy`, never on Netlify: the site is
# deliberately not linked to git, and `npm run build` imports the poker-sim
# sibling checkout, which does not exist on a Netlify build machine. If this site
# is ever connected to git for auto-deploys, this command has to go first.
#
# Deploy with:  npm run build && netlify deploy --prod --skip-functions-cache
# The flag is not optional - without it Netlify silently ships cached functions.
[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/hands.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The app is a handful of unversioned files with no build step, so a long cache
# would strand users on an old copy after every deploy. ETags make the
# revalidation a cheap 304.
# Exact paths, not "/*.js": that glob does not match and Netlify's 4-hour
# default for static assets wins, which strands users on a stale app after a
# deploy.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless"]

# The trainer lives at /play; the landing page is /. A rewrite rather than a
# redirect so the URL stays clean.
[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 200
