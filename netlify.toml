# Poker Coach - static vanilla site. No build step: public/ ships as-is.
[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/hands.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The app is a handful of unversioned files with no build step, so a long cache
# would strand users on an old copy after every deploy. ETags make the
# revalidation a cheap 304.
# Exact paths, not "/*.js": that glob does not match and Netlify's 4-hour
# default for static assets wins, which strands users on a stale app after a
# deploy.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless"]
